name: CI Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neon_orbit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Production Aligned)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies (Reproducible npm ci)
        run: npm ci

      - name: Dependency Security Audit
        run: npm run audit

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL startup timeout"
          exit 1
        shell: bash

      - name: Run Unit & Integration Tests (PostgreSQL, Redis, Migrations, Economy, Auth, Payments)
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/neon_orbit_test
          REDIS_URL: redis://localhost:6379
        run: npx vitest run --maxWorkers=2

      - name: Docker Image Build Check
        run: docker build -t neon-orbit:test .
