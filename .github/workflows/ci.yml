name: CI Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Production Aligned)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies (Reproducible npm ci)
        run: npm ci

      - name: Dependency Security Audit
        run: npm run audit

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Run Unit & Integration Tests (PostgreSQL, Redis, Migrations, Economy, Auth, Payments)
        run: npm run test

      - name: Docker Image Build Check
        run: docker build -t neon-orbit:test .
# CI fix for healthcheck and concurrency
