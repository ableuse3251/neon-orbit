version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neon_orbit_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://neon_user:CHANGE_ME_PASSWORD@postgres:5432/neon_orbit
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_USERNAME=${BOT_USERNAME:-NeonOrbitBot}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-neon_orbit_webhook_secret_123}
      - JWT_SECRET=${JWT_SECRET:-neon_orbit_jwt_secret_456}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: neon_orbit_postgres
    environment:
      POSTGRES_USER: neon_user
      POSTGRES_PASSWORD: CHANGE_ME_PASSWORD
      POSTGRES_DB: neon_orbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon_user -d neon_orbit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neon_orbit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
