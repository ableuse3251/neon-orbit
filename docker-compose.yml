version: '3.8'

services:
  # Stateless HTTP API Replicas
  web_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: neon_orbit_app:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_ROLE=web-api
      - DATABASE_URL=postgres://neon_user:${POSTGRES_PASSWORD}@pgbouncer:6432/neon_orbit
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_USERNAME=${BOT_USERNAME:-NeonOrbitBot}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - METRICS_SECRET=${METRICS_SECRET}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Dedicated Telegram Bot Handler Process
  bot_handler:
    build:
      context: .
      dockerfile: Dockerfile
    image: neon_orbit_app:latest
    environment:
      - NODE_ENV=production
      - PORT=3001
      - APP_ROLE=telegram-bot
      - DATABASE_URL=postgres://neon_user:${POSTGRES_PASSWORD}@pgbouncer:6432/neon_orbit
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_USERNAME=${BOT_USERNAME:-NeonOrbitBot}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - METRICS_SECRET=${METRICS_SECRET}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated Background Queue & Notification Worker Process
  notification_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: neon_orbit_app:latest
    environment:
      - NODE_ENV=production
      - PORT=3002
      - APP_ROLE=worker
      - DATABASE_URL=postgres://neon_user:${POSTGRES_PASSWORD}@pgbouncer:6432/neon_orbit
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_USERNAME=${BOT_USERNAME:-NeonOrbitBot}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - METRICS_SECRET=${METRICS_SECRET}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: neon_orbit_pgbouncer
    environment:
      - DB_USER=neon_user
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=neon_orbit
      - DB_HOST=postgres
      - DB_PORT=5432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=250
      - DEFAULT_POOL_SIZE=20
      - SERVER_IDLE_TIMEOUT=60
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: neon_orbit_postgres
    environment:
      POSTGRES_USER: neon_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: neon_orbit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon_user -d neon_orbit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neon_orbit_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
